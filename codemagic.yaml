# AssembleAtEase app builds (Codemagic). Started by hand from the Codemagic dashboard;
# a website push never triggers an app build. See mobile/README.md for the
# one-time setup (signing, Firebase files, store connections).
#
# Environment variable groups expected in Codemagic:
#   firebase:    FIREBASE_GOOGLE_SERVICES_JSON  (base64 of google-services.json)
#                FIREBASE_IOS_PLIST             (base64 of GoogleService-Info.plist)
#   google_play: GCLOUD_SERVICE_ACCOUNT_CREDENTIALS (Play Console service account JSON)
workflows:
  easer-android:
    name: AssembleAtEase - Android (Google Play internal testing)
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      node: 22
      java: 21
      groups:
        - firebase
        - google_play
      android_signing:
        - easer_upload_key
    scripts:
      - name: Add Firebase config
        script: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, pathlib, sys
          try:
              encoded = os.environ.get('FIREBASE_GOOGLE_SERVICES_JSON', '')
              content = base64.b64decode(''.join(encoded.split()), validate=True)
              config = json.loads(content)
              clients = config.get('client', [])
              if not any(client.get('client_info', {}).get('android_client_info', {}).get('package_name') == 'com.assembleatease.easer' for client in clients):
                  raise ValueError('package mismatch')
          except Exception:
              sys.exit('Missing or invalid Firebase Android configuration for com.assembleatease.easer. Check the firebase environment group.')
          pathlib.Path('mobile/android/app/google-services.json').write_bytes(content)
          PY
      - name: Install app dependencies
        script: cd mobile && npm ci
      - name: Sync native project
        script: cd mobile && npx cap sync android
      - name: Set version code from the build number
        script: sed -i -E "s/versionCode [0-9]+/versionCode $BUILD_NUMBER/" mobile/android/app/build.gradle
      - name: Build signed App Bundle
        script: cd mobile/android && chmod +x gradlew && ./gradlew bundleRelease
    artifacts:
      - mobile/android/app/build/outputs/**/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true

  easer-ios:
    name: AssembleAtEase - iOS (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: AssembleAtEase App Store Connect
    environment:
      node: 22
      # Pinned: Codemagic support (2026-10-09) reported a queue spike on the default
      # Xcode 26.6 machine pool. 26.5 is the same iOS 26 toolchain (Capacitor 8 needs 26+).
      xcode: 26.5
      groups:
        - firebase
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.assembleatease.easer
    scripts:
      - name: Check Xcode requirement
        script: |
          set -euo pipefail
          version="$(xcodebuild -version | awk '/^Xcode / {print $2}')"
          major="${version%%.*}"
          if ! [[ "$major" =~ ^[0-9]+$ ]] || (( major < 26 )); then
            echo "Capacitor 8 requires Xcode 26.0 or newer. Select a compatible Codemagic image."
            exit 1
          fi
      - name: Add Firebase config
        script: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os, pathlib, plistlib, sys
          try:
              encoded = os.environ.get('FIREBASE_IOS_PLIST', '')
              content = base64.b64decode(''.join(encoded.split()), validate=True)
              config = plistlib.loads(content)
              if config.get('BUNDLE_ID') != 'com.assembleatease.easer' or not config.get('GOOGLE_APP_ID'):
                  raise ValueError('bundle mismatch or missing app ID')
          except Exception:
              sys.exit('Missing or invalid Firebase iOS configuration for com.assembleatease.easer. Check the firebase environment group.')
          pathlib.Path('mobile/ios/App/App/GoogleService-Info.plist').write_bytes(content)
          PY
      - name: Install app dependencies
        script: cd mobile && npm ci
      - name: Sync native project
        script: cd mobile && npx cap sync ios
      - name: Use signing profiles
        script: xcode-project use-profiles --project mobile/ios/App/App.xcodeproj
      - name: Set build number
        script: cd mobile/ios/App && agvtool new-version -all "$BUILD_NUMBER"
      - name: Build signed IPA
        script: xcode-project build-ipa --project mobile/ios/App/App.xcodeproj --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        # Upload only. Internal testers (App Store Connect users) get every processed
        # build without review. External beta review needs a Beta App Description and
        # is not wanted until the Easer flow passes on a real iPhone (EASER-NATIVE-APP).
        submit_to_testflight: false

  customer-ios:
    name: AssembleAtEase Customer - iOS (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: AssembleAtEase App Store Connect
    environment:
      # Same toolchain as the Easer app (easer-ios).
      xcode: 26.5
      groups:
        - firebase
      ios_signing:
        # Also signs the lock-screen tracker, com.assembleatease.customer.live:
        # Codemagic matches com.assembleatease.customer.* profiles.
        distribution_type: app_store
        bundle_identifier: com.assembleatease.customer
    scripts:
      - name: Add the Firebase configuration
        # FIREBASE_IOS_CUSTOMER_PLIST (base64 of the customer app's
        # GoogleService-Info.plist, bundle com.assembleatease.customer) is in the
        # firebase group. Without it the app builds and sends no notifications.
        script: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os, pathlib, plistlib, sys
          raw = os.environ.get('FIREBASE_IOS_CUSTOMER_PLIST', '').strip()
          if not raw:
              print('FIREBASE_IOS_CUSTOMER_PLIST not set: building without notifications.')
              sys.exit(0)
          content = base64.b64decode(raw)
          if plistlib.loads(content).get('BUNDLE_ID') != 'com.assembleatease.customer':
              sys.exit('FIREBASE_IOS_CUSTOMER_PLIST is not the configuration for com.assembleatease.customer.')
          pathlib.Path('mobile/ios/Customer/Support/GoogleService-Info.plist').write_bytes(content)
          print('Firebase configuration added.')
          PY
      - name: Generate the Xcode project
        # The customer app is described in mobile/ios/Customer/project.yml and
        # shares mobile/ios/Shared with the Easer app; XcodeGen writes the project.
        script: |
          set -euo pipefail
          brew install xcodegen
          cd mobile/ios/Customer && xcodegen generate
      - name: Fetch Swift packages
        # Stripe's iOS SDK (card sheet). Fetched on its own so a package problem
        # shows here, not inside the archive log.
        script: |
          set -euo pipefail
          cd mobile/ios/Customer && xcodebuild -resolvePackageDependencies -project Customer.xcodeproj -scheme Customer
      - name: Use signing profiles
        script: xcode-project use-profiles --project mobile/ios/Customer/Customer.xcodeproj
      - name: Set build number
        script: cd mobile/ios/Customer && agvtool new-version -all "$BUILD_NUMBER"
      - name: Build signed IPA
        script: xcode-project build-ipa --project mobile/ios/Customer/Customer.xcodeproj --scheme Customer
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        # Upload only, like the Easer app: internal testers get every processed build.
        submit_to_testflight: false

  # App Store screenshots of the real customer app, on the 6.9-inch simulator
  # (1320 x 2868). Browses as a guest; signs nothing, uploads nothing to Apple.
  # The PNGs are this workflow's artifacts.
  customer-screenshots:
    name: AssembleAtEase Customer - App Store screenshots
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: 26.5
    scripts:
      - name: Generate the Xcode project
        script: |
          set -euo pipefail
          brew install xcodegen
          cd mobile/ios/Customer && xcodegen generate
      - name: Pick and boot a 6.9-inch simulator
        script: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[(r,x) for r,l in d.items() if 'iOS' in r for x in l if 'Pro Max' in x['name']]
          c.sort(key=lambda t:(t[0],t[1]['name']))
          print(c[-1][1]['udid'])")
          xcrun simctl list devices available | grep "$UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --dataNetwork wifi --wifiBars 3 --cellularBars 4 --batteryState charged --batteryLevel 100
          echo "SIM_UDID=$UDID" >> $CM_ENV
      - name: Take the screenshots
        script: |
          set -euo pipefail
          rm -rf "$HOME/aae-screens"
          cd mobile/ios/Customer
          xcodebuild test -project Customer.xcodeproj -scheme CustomerScreenshots \
            -destination "id=$SIM_UDID" CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath "$CM_BUILD_DIR/screenshots.xcresult" | tail -40
          ls -la "$HOME/aae-screens"
          mkdir -p "$CM_BUILD_DIR/screenshots" && cp "$HOME"/aae-screens/*.png "$CM_BUILD_DIR/screenshots/"
          sips -g pixelWidth -g pixelHeight "$CM_BUILD_DIR"/screenshots/*.png
    artifacts:
      - screenshots/*.png
