# Easer app App Store screenshots (codemagic.yaml easer-screenshots).
# XcodeGen builds a simulator-only project from the same Swift sources, assets and
# String Catalogs as the release app, plus a UI test that signs in to the App
# Review demo Easer and saves each screen in English and Spanish.
# App.xcodeproj stays the only project that ships: this one is never signed,
# never archived and never uploaded. The generated EaserShots.xcodeproj is not
# committed.
name: EaserShots
options:
  bundleIdPrefix: com.assembleatease
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "1"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "12.0.0"
targets:
  EaserShots:
    type: application
    platform: iOS
    dependencies:
      - package: Firebase
        product: FirebaseMessaging
    sources:
      - path: App
        excludes:
          - "*.entitlements"
          - "public"
          - "public/**"
          - "config.xml"
          - "capacitor.config.json"
          - "GoogleService-Info.plist"
      - path: ../Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.assembleatease.easer
        PRODUCT_NAME: Easer
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: EaserIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: NO
  EaserShotsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
        excludes:
          - "*.json"
    dependencies:
      - target: EaserShots
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.assembleatease.easer.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: EaserShots
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: NO
schemes:
  EaserScreenshots:
    build:
      targets:
        EaserShots: all
        EaserShotsUITests: [test]
    test:
      targets:
        - EaserShotsUITests
