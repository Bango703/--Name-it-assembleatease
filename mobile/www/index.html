<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AssembleAtEase</title>
<style>
  :root { color-scheme: light dark; --bg:#ffffff; --ink:#0d1117; --soft:#475569; --brand:#00BFFF; --brand-ink:#04222c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0c1419; --ink:#e7eef2; --soft:#b3c2cc; } }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--ink);
         font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; padding:24px env(safe-area-inset-right) 24px env(safe-area-inset-left); box-sizing:border-box; }
  main { max-width:360px; text-align:center; display:grid; gap:14px; padding:0 16px; }
  h1 { font-size:1.35rem; margin:0; }
  p { margin:0; color:var(--soft); line-height:1.55; }
  button { justify-self:center; background:var(--brand); color:var(--brand-ink); border:0; border-radius:999px; padding:12px 26px; font-weight:800; font-size:1rem; min-height:44px; }
</style>
</head>
<body>
<main>
  <h1>You're offline</h1>
  <p>Connect to the internet to view your bookings or Easer jobs.</p>
  <button type="button" id="retry">Try again</button>
</main>
<script>
  document.getElementById('retry').addEventListener('click', function () {
    window.location.href = 'https://www.assembleatease.com/app';
  });
  window.addEventListener('online', function () {
    window.location.href = 'https://www.assembleatease.com/app';
  });
</script>
</body>
</html>
