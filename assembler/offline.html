<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Connection unavailable — Easer</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#00BFFF" />
  <link rel="stylesheet" href="../assets/css/easer.css" />
  <style>
    body { display:grid; min-height:100vh; padding:1.5rem; place-items:center; }
    .offline-panel { width:min(100%,420px); text-align:center; }
    .offline-mark { width:44px; height:44px; margin:0 auto 1rem; border:2px solid var(--e-border-md); border-radius:50%; display:grid; place-items:center; color:var(--e-muted); }
    .offline-panel h1 { font-size:1.2rem; margin-bottom:0.5rem; }
    .offline-panel p { color:var(--e-muted); font-size:0.9rem; line-height:1.6; margin-bottom:1.25rem; }
    .offline-retry { min-height:44px; display:inline-flex; align-items:center; justify-content:center; padding:0.7rem 1.2rem; border-radius:10px; background:var(--e-teal); color:#04222c; font-weight:800; text-decoration:none; }
  </style>
</head>
<body>
  <main class="offline-panel">
    <div class="offline-mark" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 1l22 22"/><path d="M8.5 4.5A14.5 14.5 0 0 1 12 4c4.3 0 8.1 1.9 10.5 5"/><path d="M4.2 7.2A13.8 13.8 0 0 0 1.5 9"/><path d="M5 13a10 10 0 0 1 6.2-2.9"/><path d="M15.9 11a10.2 10.2 0 0 1 3.1 2"/><path d="M8.5 16.5A5 5 0 0 1 12 15c1.1 0 2.2.4 3 1"/><circle cx="12" cy="20" r="1" fill="currentColor" stroke="none"/></svg>
    </div>
    <h1>Connection unavailable</h1>
    <p>Your private job and payout information is not stored on this offline screen. Reconnect, then try again.</p>
    <a class="offline-retry" href="/assembler/">Try again</a>
  </main>
</body>
</html>
