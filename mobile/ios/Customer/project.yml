# AssembleAtEase customer app (iPhone). Codemagic generates Customer.xcodeproj
# from this file with XcodeGen (workflow customer-ios in codemagic.yaml); the
# generated project is never committed. Sources: Customer/ plus the code both
# apps share (../Shared). Assets: the same catalog as the Easer app, so the
# logo is the one real AAE monogram. Card payments use Stripe's iOS SDK
# (Swift Package Manager), the customer app only; the Easer app takes no payments.
name: Customer
options:
  bundleIdPrefix: com.assembleatease
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: apple-generic
    DEVELOPMENT_TEAM: S8YYTR562D
packages:
  Stripe:
    url: https://github.com/stripe/stripe-ios-spm
    from: "26.14.0"
targets:
  Customer:
    type: application
    platform: iOS
    dependencies:
      - package: Stripe
        product: Stripe
      - package: Stripe
        product: StripePaymentSheet
    sources:
      - path: Customer
      - path: ../Shared
      - path: ../App/App/Assets.xcassets
        buildPhase: resources
      - path: Support/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.assembleatease.customer
        PRODUCT_NAME: AssembleAtEase
        INFOPLIST_FILE: Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    scheme: {}
