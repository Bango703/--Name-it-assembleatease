# AssembleAtEase customer app (iPhone). Codemagic generates Customer.xcodeproj
# from this file with XcodeGen (workflow customer-ios in codemagic.yaml); the
# generated project is never committed. Sources: Customer/ plus the code both
# apps share (../Shared). Assets: the same catalog as the Easer app, so the
# logo is the one real AAE monogram. Card payments use Stripe's iOS SDK
# (Swift Package Manager), the customer app only; the Easer app takes no payments.
name: Customer
options:
  bundleIdPrefix: com.assembleatease
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: apple-generic
    DEVELOPMENT_TEAM: S8YYTR562D
packages:
  Stripe:
    url: https://github.com/stripe/stripe-ios-spm
    from: "26.14.0"
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "12.0.0"
targets:
  Customer:
    type: application
    platform: iOS
    dependencies:
      - package: Stripe
        product: Stripe
      - package: Stripe
        product: StripePaymentSheet
      - package: Firebase
        product: FirebaseMessaging
      - target: CustomerLiveActivity
    sources:
      - path: Customer
      - path: ../Shared
      - path: LiveShared
      # Written by the Codemagic build from FIREBASE_IOS_CUSTOMER_PLIST; absent locally.
      - path: Support/GoogleService-Info.plist
        optional: true
        buildPhase: resources
      - path: ../App/App/Assets.xcassets
        buildPhase: resources
      - path: Support/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.assembleatease.customer
        PRODUCT_NAME: AssembleAtEase
        INFOPLIST_FILE: Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/Customer.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    scheme: {}
  # App Store screenshots (codemagic.yaml customer-screenshots). Simulator only;
  # never archived, never signed for distribution.
  CustomerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Customer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.assembleatease.customer.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Customer
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
  # The lock-screen tracker (Live Activity), embedded in the app.
  CustomerLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: LiveActivity
      - path: LiveShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.assembleatease.customer.live
        PRODUCT_NAME: CustomerLiveActivity
        INFOPLIST_FILE: LiveActivity/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
schemes:
  # Only the screenshot workflow uses this scheme; the release scheme (Customer)
  # has no test targets, so the App Store build is unchanged.
  CustomerScreenshots:
    build:
      targets:
        Customer: all
        CustomerUITests: [test]
    test:
      targets:
        - CustomerUITests
